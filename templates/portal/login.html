{% extends "base.html" %}

{% block title %}Business Owner Portal | GeoAttend{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-6">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-8">
        <!-- Tab Selector -->
        <div class="flex border-b border-slate-200 mb-6">
            <button id="tab-login-btn" onclick="showTab('login')"
                class="flex-1 py-3 text-sm font-bold text-center text-indigo-600 border-b-2 border-indigo-600 transition-all">
                Business Sign In
            </button>
            <button id="tab-register-btn" onclick="showTab('register')"
                class="flex-1 py-3 text-sm font-bold text-center text-slate-400 border-b-2 border-transparent transition-all">
                Register Business
            </button>
        </div>

        <!-- Login Form -->
        <div id="form-login" class="space-y-4">
            <form method="POST" action="{{ url_for('tenant.login') }}" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Owner Email</label>
                    <input type="email" name="email" required placeholder="owner@company.com" 
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none text-slate-800">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Password</label>
                    <input type="password" name="password" required placeholder="••••••••" 
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none text-slate-800">
                </div>

                <button type="submit" 
                    class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-100 transition-all">
                    Sign In to Portal
                </button>
            </form>
        </div>

        <!-- Register Form -->
        <div id="form-register" class="space-y-4 hidden">
            <form method="POST" action="{{ url_for('tenant.register') }}" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Business Name</label>
                    <input type="text" name="business_name" required placeholder="Acme Global Inc"
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none text-slate-800">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Owner Email</label>
                    <input type="email" name="owner_email" required placeholder="owner@acmeglobal.com"
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none text-slate-800">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Create Password</label>
                    <input type="password" name="password" required placeholder="••••••••"
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none text-slate-800">
                </div>

                <button type="submit" 
                    class="w-full py-3 px-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-100 transition-all">
                    Register Business Account
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    function showTab(tab) {
        const loginForm = document.getElementById('form-login');
        const regForm = document.getElementById('form-register');
        const loginBtn = document.getElementById('tab-login-btn');
        const regBtn = document.getElementById('tab-register-btn');

        if (tab === 'login') {
            loginForm.classList.remove('hidden');
            regForm.classList.add('hidden');
            loginBtn.className = "flex-1 py-3 text-sm font-bold text-center text-indigo-600 border-b-2 border-indigo-600 transition-all";
            regBtn.className = "flex-1 py-3 text-sm font-bold text-center text-slate-400 border-b-2 border-transparent transition-all";
        } else {
            loginForm.classList.add('hidden');
            regForm.classList.remove('hidden');
            regBtn.className = "flex-1 py-3 text-sm font-bold text-center text-indigo-600 border-b-2 border-indigo-600 transition-all";
            loginBtn.className = "flex-1 py-3 text-sm font-bold text-center text-slate-400 border-b-2 border-transparent transition-all";
        }
    }

    {% if register_mode %}
        showTab('register');
    {% endif %}
</script>
{% endblock %}
